<div class="card auth-card">
    <div class="card-body">
        <div class="text-center mb-4">
            <img src="assets/img/logo.svg" class="auth-logo mb-3" alt="Sofra">
            <h1 class="h4 fw-bold mb-1">Create your account</h1>
            <p class="text-muted mb-0">Share your family recipes with everyone</p>
        </div>

        <form id="register-form" novalidate>
            <div class="row g-3 mb-3">
                <div class="col-sm-6">
                    <label for="reg-first-name" class="form-label">First name</label>
                    <input type="text" class="form-control" id="reg-first-name" name="first_name" autocomplete="given-name">
                </div>
                <div class="col-sm-6">
                    <label for="reg-last-name" class="form-label">Last name</label>
                    <input type="text" class="form-control" id="reg-last-name" name="last_name" autocomplete="family-name">
                </div>
            </div>
            <div class="mb-3">
                <label for="reg-email" class="form-label">Email</label>
                <input type="email" class="form-control" id="reg-email" name="email" placeholder="you@example.com" autocomplete="email">
            </div>
            <div class="mb-3">
                <label for="reg-city" class="form-label">City <span class="text-muted">(optional)</span></label>
                <input type="text" class="form-control" id="reg-city" name="city" placeholder="Sarajevo">
            </div>
            <div class="mb-3">
                <label for="reg-password" class="form-label">Password</label>
                <input type="password" class="form-control" id="reg-password" name="password" autocomplete="new-password">
                <div class="form-text">At least 8 characters.</div>
            </div>
            <div class="mb-4">
                <label for="reg-password-repeat" class="form-label">Repeat password</label>
                <input type="password" class="form-control" id="reg-password-repeat" name="password_repeat" autocomplete="new-password">
            </div>
            <!-- M1: static page. Registration is connected in M4. -->
            <a href="#login" class="btn btn-primary w-100 py-2">Create account</a>
        </form>

        <p class="text-center text-muted mt-4 mb-0">
            Already have an account? <a href="#login">Log in</a>
        </p>
    </div>
</div>
