<div class="modal fade" id="ingredient-modal" tabindex="-1" aria-labelledby="ingredient-modal-title" aria-hidden="true">
    <div class="modal-dialog">
        <form class="modal-content" id="ingredient-form" novalidate>
            <div class="modal-header">
                <h2 class="modal-title h5" id="ingredient-modal-title">Ingredient</h2>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label" for="ingredients-name">Name</label>
                    <input type="text" class="form-control" id="ingredients-name" name="name">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="ingredients-unit">Unit</label>
                    <select class="form-select" id="ingredients-unit" name="unit"><option>g</option><option>ml</option><option>pcs</option><option>tbsp</option><option>tsp</option></select>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="ingredients-calories-per-100">Calories per 100 g</label>
                    <input type="number" class="form-control" id="ingredients-calories-per-100" name="calories_per_100">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Save</button>
            </div>
        </form>
    </div>
</div>

<div class="modal fade" id="delete-ingredient-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-body text-center p-4">
                <i class="bi bi-exclamation-triangle text-danger fs-1"></i>
                <h2 class="h5 mt-2">Delete this ingredient?</h2>
                <p class="text-muted mb-0">This cannot be undone.</p>
            </div>
            <div class="modal-footer justify-content-center">
                <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Delete</button>
            </div>
        </div>
    </div>
</div>

<script>
    new DataTable("#ingredients-table", { pageLength: 10, columnDefs: [{ orderable: false, targets: -1 }] });
</script>
