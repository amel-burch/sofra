<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sofra · Recipes</title>
    <link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/2.1.8/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/spapp.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">

    <!-- Sidebar: offcanvas on mobile, fixed column on desktop -->
    <aside class="sidebar">
        <div class="offcanvas-lg offcanvas-start" tabindex="-1" id="sidebar">
            <div class="offcanvas-header">
                <a href="#dashboard" class="brand"><img src="assets/img/logo.svg" alt=""> Sofra</a>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" data-bs-target="#sidebar" aria-label="Close"></button>
            </div>
            <div class="offcanvas-body flex-column">
                <a href="#dashboard" class="brand d-none d-lg-flex"><img src="assets/img/logo.svg" alt=""> Sofra</a>

                <nav class="nav flex-column" id="main-nav">
                    <span class="nav-section">Kitchen</span>
                    <a class="nav-link" href="#dashboard"><i class="bi bi-grid-1x2"></i> Dashboard</a>
                    <a class="nav-link" href="#recipes"><i class="bi bi-journal-text"></i> Recipes</a>
                    <a class="nav-link" href="#favorites"><i class="bi bi-heart"></i> Favorites</a>
                    <a class="nav-link" href="#world-kitchen"><i class="bi bi-globe2"></i> World kitchen</a>

                    <span class="nav-section">Administration</span>
                    <a class="nav-link" href="#categories"><i class="bi bi-tags"></i> Categories</a>
                    <a class="nav-link" href="#ingredients"><i class="bi bi-basket"></i> Ingredients</a>
                    <a class="nav-link" href="#reviews"><i class="bi bi-chat-square-text"></i> Reviews</a>
                    <a class="nav-link" href="#users"><i class="bi bi-people"></i> Users</a>

                    <span class="nav-section">Account</span>
                    <a class="nav-link" href="#profile"><i class="bi bi-person-circle"></i> My profile</a>
                    <a class="nav-link" href="#login"><i class="bi bi-box-arrow-right"></i> Log out</a>
                </nav>
            </div>
        </div>
    </aside>

    <div class="app-main">
        <header class="topbar">
            <button class="btn btn-light d-lg-none me-2" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebar" aria-label="Open menu">
                <i class="bi bi-list"></i>
            </button>
            <span class="topbar-title" id="page-title">Dashboard</span>

            <div class="dropdown ms-auto">
                <button class="btn user-chip dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
                    <span class="avatar">AK</span>
                    <span class="d-none d-sm-inline">Amel Karšić</span>
                    <span class="badge text-bg-primary">admin</span>
                </button>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li><a class="dropdown-item" href="#profile"><i class="bi bi-person me-2"></i>My profile</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><a class="dropdown-item" href="#login"><i class="bi bi-box-arrow-right me-2"></i>Log out</a></li>
                </ul>
            </div>
        </header>

        <!-- SPA views: every <section> is one page loaded from views/. The LAST section is the default view. -->
        <main id="spapp" role="main">
            <section id="login" data-load="login.html"></section>
            <section id="register" data-load="register.html"></section>
            <section id="recipes" data-load="recipes.html"></section>
            <section id="recipe-details" data-load="recipe-details.html"></section>
            <section id="favorites" data-load="favorites.html"></section>
            <section id="world-kitchen" data-load="world-kitchen.html"></section>
            <section id="categories" data-load="categories.html"></section>
            <section id="ingredients" data-load="ingredients.html"></section>
            <section id="reviews" data-load="reviews.html"></section>
            <section id="users" data-load="users.html"></section>
            <section id="profile" data-load="profile.html"></section>
            <section id="error_404" data-load="404.html"></section>
            <section id="dashboard" data-load="dashboard.html"></section>
        </main>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/2.1.8/js/dataTables.min.js"></script>
<script src="https://cdn.datatables.net/2.1.8/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highcharts@11.4.8/highcharts.js"></script>

<script src="js/lib/jquery.spapp.js"></script>
<script src="js/app.js"></script>
</body>
</html>
